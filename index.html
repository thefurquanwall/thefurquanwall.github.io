<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FURQUAN WALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{height:100dvh;background:#000;display:flex;flex-direction:column}
.top{flex:1;background:url('portada.jpg') center 20%/cover no-repeat;filter:brightness(1.25)}
.bot{background:#000;padding:22px 16px 28px}
.t{color:#d6d6d6;font-size:12px;letter-spacing:2.5px;margin-bottom:16px}
.box{display:flex;background:#161616;border:1px solid #2e2e2e;border-radius:16px;padding:5px}
.box input{flex:1;background:0;border:0;color:#fff;padding:14px 16px;outline:0;font-size:15px}
.box button{background:#fff;color:#000;border:0;border-radius:12px;padding:14px 24px;font-weight:900;font-size:13px}
#r{display:none;position:fixed;inset:0;background:#000;z-index:99;padding:20px}
</style>
</head>
<body>
<div class="top"></div>
<div class="bot">
<div class="t">THE FURQUAN WALL · FARSA O VERDAD</div>
<form id="f" class="box"><input id="u" placeholder="Pega el link aquí..." required><button>ENVIAR</button></form>
</div>
<div id="r"><div style="max-width:400px;margin:40px auto;color:#fff"><div id="h"></div><div id="d" style="margin:20px 0;font-size:20px;font-weight:700"></div><div id="c" style="background:#111;border:1px solid #222;border-radius:16px;padding:16px"></div><button onclick="r.style.display='none'" style="width:100%;margin-top:20px;padding:18px;border-radius:14px;border:none;font-weight:900">CERRAR</button></div></div>
<script>
f.onsubmit=e=>{e.preventDefault();let v=u.value.toLowerCase();r.style.display='block';d.textContent=v;h.innerHTML=v.includes('511tactical.com')?'<div style="color:#00ff88;font-weight:900;font-size:26px">VERDAD ✓</div>':'<div style="color:#ff3333;font-weight:900;font-size:26px">FARSA !</div>';c.innerHTML=v.includes('511tactical.com')?'✅ Oficial 5.11 Tactical':'❌ Sospechoso';}
</script>
</body>
</html>
