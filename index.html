DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FURQUAN WALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{height:100dvh;background:#000;display:flex;flex-direction:column}
.top{
  flex:1;
  background: url('IMG_1740.png') center 20% / cover no-repeat;
  filter: brightness(1.25) contrast(1.05) grayscale(0.1);
}
.bottom{
  background:#000;
  padding:22px 16px 28px;
  border-top:1px solid #111;
}
.label{
  color:#d6d6d6;
  font-size:13px;
  letter-spacing:2.5px;
  margin-bottom:16px;
  font-weight:400;
  text-transform:uppercase;
}
.pill{
  display:flex;
  align-items:center;
  background:#161616;
  border:1px solid #2e2e2e;
  border-radius:16px;
  padding:5px;
}
.pill input{
  flex:1;
  background:transparent;
  border:none;
  color:#fff;
  padding:14px 16px;
  outline:none;
  font-size:15px;
}
.pill button{
  background:#ffffff;
  color:#000;
  border:none;
  border-radius:12px;
  padding:14px 24px;
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  cursor:pointer;
  flex-shrink:0;
}
#res{display:none;position:fixed;inset:0;background:#000;z-index:99;padding:20px;overflow:auto}
</style>
</head>
<body>

<div class="top"></div>

<div class="bottom">
  <div class="label">THE FURQUAN WALL · FARSA O VERDAD</div>
  <form id="f" class="pill">
    <input id="u" placeholder="Pega el link aquí..." required>
    <button>ENVIAR</button>
  </form>
</div>

<div id="res">
 <div style="max-width:400px;margin:40px auto;color:#fff">
  <div id="h"></div>
  <div id="d" style="margin:20px 0;font-size:20px;font-weight:700;word-break:break-all"></div>
  <div id="c" style="background:#111;border:1px solid #222;border-radius:16px;padding:16px;line-height:2"></div>
  <div style="background:#111;border:1px solid #222;border-radius:16px;padding:16px;margin-top:12px"><div style="color:#666;font-size:10px;letter-spacing:1px">DETALLES</div><div id="t" style="color:#999;font-size:13px;margin-top:8px;line-height:1.5"></div></div>
  <button onclick="res.style.display='none'" style="width:100%;margin-top:20px;padding:18px;border-radius:14px;border:none;font-weight:900;background:#fff;color:#000">CERRAR</button>
 </div>
</div>

<script>
f.onsubmit=e=>{
e.preventDefault();
let v=u.value.toLowerCase().trim();
res.style.display='block';
d.textContent=v;
if(v.includes('511tactical.com')){
h.innerHTML='<div style="color:#00ff88;font-weight:900;font-size:26px">VERDAD ✓</div><div style="color:#00ff88;font-size:11px">VERIFICADO</div>';
c.innerHTML='✅ Dominio oficial 5.11 Tactical USA<br>✅ Desde 1968 · Registrado 2003<br>✅ Seguro';
t.textContent='511tactical.com es el sitio oficial de 5.11 Tactical.';
}else{
h.innerHTML='<div style="color:#ff3333;font-weight:900;font-size:26px">FARSA !</div><div style="color:#ff3333;font-size:11px">PELIGRO</div>';
c.innerHTML='❌ Dominio sospechoso<br>❌ Posible clon<br>❌ No ingreses tarjeta';
t.textContent='Dominio '+v+' no coincide con oficiales.';
}
}
</script>
</body>
</html>
