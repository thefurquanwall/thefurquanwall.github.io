<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FURQUAN WALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{height:100dvh;background:#000;display:flex;flex-direction:column}
.top{flex:1;background:url('IMG_1740.png') center top / cover no-repeat;position:relative}
.top::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,#000 95%)}
.bottom{background:#000;padding:24px 16px 32px}
.title{color:#fff;font-size:12px;letter-spacing:2px;opacity:.7;margin-bottom:20px}
.box{display:flex;gap:12px;background:#111;border:1px solid #222;border-radius:14px;padding:6px}
.box input{flex:1;background:transparent;border:none;color:#fff;padding:12px;outline:none;font-size:15px}
.box button{background:#fff;color:#000;border:none;border-radius:10px;padding:0 22px;font-weight:800;font-size:13px;letter-spacing:1px}
#respuesta{display:none;position:fixed;inset:0;background:#050505;z-index:99;padding:20px;overflow:auto}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:20px}
</style>
</head>
<body>

<div class="top"></div>

<div class="bottom">
  <div class="title">THE FURQUAN WALL · FARSA O VERDAD</div>
  <form id="wallForm" class="box">
    <input id="link" type="text" placeholder="Pega el link aquí..." required>
    <button>ENVIAR</button>
  </form>
</div>

<div id="respuesta">
 <div style="max-width:400px;margin:40px auto 0">
  <div id="headerResult"></div>
  <div id="dominioResult" style="margin:20px 0;color:#fff;font-weight:700;font-size:18px"></div>
  <div class="card" id="checksResult" style="color:#fff;line-height:2"></div>
  <div class="card" style="margin-top:12px"><div style="color:#666;font-size:10px;letter-spacing:1px;margin-bottom:8px">DETALLES</div><div id="detallesResult" style="color:#aaa;font-size:13px;line-height:1.5"></div></div>
  <button onclick="document.getElementById('respuesta').style.display='none'" style="width:100%;margin-top:20px;background:#fff;color:#000;border:none;border-radius:14px;padding:18px;font-weight:800">CERRAR</button>
 </div>
</div>

<script>
document.getElementById('wallForm').addEventListener('submit', e=>{
 e.preventDefault();
 let url=document.getElementById('link').value.toLowerCase().trim();
 document.getElementById('respuesta').style.display='block';
 document.getElementById('dominioResult').innerHTML=url;
 if(url.includes('511tactical.com')){
   document.getElementById('headerResult').innerHTML='<div style="display:flex;align-items:center;gap:12px"><div style="background:#00ff88;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#000;font-size:20px">✓</div><div><div style="color:#00ff88;font-weight:900;font-size:20px">VERDAD</div><div style="color:#00ff88;font-size:10px;opacity:.8">VERIFICADO · RESULTADO POSITIVO</div></div></div>';
   document.getElementById('checksResult').innerHTML='✅ Dominio oficial 5.11 Tactical USA<br>✅ Desde 1968 · Registrado 2003<br>✅ SSL válido · Seguro';
   document.getElementById('detallesResult').innerHTML='511tactical.com es el sitio oficial de 5.11 Tactical. Marca estadounidense de equipo táctico con más de 50 años de historia.';
 } else {
   document.getElementById('headerResult').innerHTML='<div style="display:flex;align-items:center;gap:12px"><div style="background:#ff3333;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px">!</div><div><div style="color:#ff3333;font-weight:900;font-size:20px">FARSA</div><div style="color:#ff3333;font-size:10px">PELIGRO · POSIBLE ESTAFA</div></div></div>';
   document.getElementById('checksResult').innerHTML='❌ Dominio no oficial<br>❌ Posible clon para robar datos<br>❌ No ingreses tu tarjeta';
   document.getElementById('detallesResult').innerHTML='El dominio <b>'+url+'</b> no coincide con registros oficiales. Cuidado con ofertas 90% off.';
 }
});
</script>
</body>
</html>
