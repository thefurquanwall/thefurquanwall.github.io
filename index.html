<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FURQUAN WALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{height:100dvh;background:#000;display:flex;flex-direction:column}
.hero{flex:1;background:url('IMG_1740.png') center top/cover no-repeat}
.panel{background:#000;padding:12px}
.card{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;padding:24px 18px 16px}
.card .title{color:#b8b8b8;font-size:12px;letter-spacing:.8px;margin-bottom:22px}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;background:#111;border:1px solid #3a3a3a;border-radius:8px;padding:14px;color:#fff;outline:none}
.row button{background:#3a3a3a;color:#aaa;border:0;border-radius:8px;padding:14px 18px;font-weight:700;font-size:12px}
.foot{text-align:center;color:#555;font-size:11px;margin-top:26px}
#res{display:none;position:fixed;inset:0;background:#000;z-index:99;padding:20px}
</style>
</head>
<body>
<div class="hero"></div>
<div class="panel">
<div class="card">
<div class="title">THE FURQUAN WALL · FARSA O VERDAD</div>
<form id="f" class="row"><input id="u" placeholder="Ingrese el enlace a verificar..." required><button>ENVIAR</button></form>
<div class="foot">www.thefurquanwall.github.io</div>
</div>
</div>
<div id="res"><div style="max-width:380px;margin:40px auto;color:#fff"><div id="h"></div><div id="d" style="margin:20px 0;font-weight:700"></div><div id="c" style="background:#111;border:1px solid #222;border-radius:12px;padding:14px"></div><button onclick="res.style.display='none'" style="width:100%;margin-top:20px;padding:16px;border-radius:12px;border:none;font-weight:900">CERRAR</button></div></div>
<script>
f.onsubmit=e=>{e.preventDefault();let v=u.value.toLowerCase();res.style.display='block';d.textContent=v;h.innerHTML=v.includes('511tactical.com')?'<div style="color:#00ff88;font-weight:900;font-size:24px">VERDAD ✓</div>':'<div style="color:#ff3333;font-weight:900;font-size:24px">FARSA !</div>';c.innerHTML=v.includes('511tactical.com')?'✅ Oficial':'❌ Sospechoso';}
</script>
</body>
</html>
