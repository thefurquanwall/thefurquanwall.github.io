<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FURQUAN WALL - FARSA O VERDAD</title>
<style>
body{margin:0;background:#050505;color:white;font-family:monospace}
.hero{width:100%;height:55vh;object-fit:cover;filter:grayscale(100%) contrast(1.2)}
.wrap{max-width:600px;margin:0 auto;padding:20px}
h1{text-align:center;margin:10px 0 0;font-size:28px;letter-spacing:3px}
.sub{text-align:center;color:#ff2a2a;font-weight:900;margin:0 0 20px}
.box{background:#0a0a0a;border:2px solid #222;border-radius:12px;padding:20px}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #333;background:#111;color:white;box-sizing:border-box}
button{width:100%;margin-top:10px;padding:14px;background:#ff2a2a;color:white;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:16px}
#res{margin-top:20px;display:none;text-align:center;background:#111;padding:20px;border-radius:10px}
</style>
</head>
<body>

<img class="hero" src="IMG_1757_FINAL.jpg" alt="The Furquan Wall">

<div class="wrap">
<h1>THE FURQUAN WALL</h1>
<p class="sub">FARSA O VERDAD</p>

<div class="box">
<form id="f">
<input id="u" placeholder="Pega link: 511-chile.store / nike-argentina.shop">
<button type="submit">CONSULTAR LINK</button>
</form>

<div id="res">
<div id="d" style="color:#666;font-size:11px"></div>
<div id="h" style="margin:15px 0"></div>
<div id="c" style="font-size:13px;line-height:1.6;text-align:left"></div>
<div id="t" style="margin-top:15px;font-size:11px;color:#555"></div>
</div>
</div>

<div style="margin-top:30px;font-size:11px;color:#444;line-height:1.5">
<p>DATOS REALES: Argentina y Chile = 14.3% ataques clonados (Ekoparty 2024) / Loterías truchas $351M perdidos en 2024 USA / 5.11 clones usan 85% descuento falso</p>
</div>
</div>

<script>
f.onsubmit=e=>{
 e.preventDefault();
 let raw=u.value.trim().toLowerCase();
 if(!raw)return;
 let dominio=raw.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].split('?')[0];
 res.style.display='block'; d.textContent=dominio;

 const oficiales=["511tactical.com","nike.com","adidas.com","puma.com","thenorthface.com","mercadolibre.com","thefurquanwall.github.io"];
 let esOfi=oficiales.some(m=>dominio===m||dominio.endsWith("."+m)||dominio.includes("thefurquanwall"));
 let lot=["loteria","lotería","powerball","mega","premio","ganaste","sorteo","lotto"];
 let esLot=lot.some(p=>dominio.includes(p));
 let truchos=[".store",".shop",".xyz",".online",".top",".buzz",".cheap"];
 let esTld=truchos.some(t=>dominio.endsWith(t));
 let esMarca=oficiales.some(m=>dominio.includes(m.split(".")[0])&&dominio!==m) || dominio.includes("511");

 if(esOfi){
  h.innerHTML='<div style="color:#00ff88;font-size:32px;font-weight:900">VERDAD ✓</div>';
  c.innerHTML='✅ Dominio oficial verificado<br>✅ PINTA VERDE';
  t.textContent='Oficial en mismo index.';
 }else if(esLot || (esMarca && esTld)){
  h.innerHTML='<div style="color:#ff2a2a;font-size:32px;font-weight:900">FARSA !</div>';
  c.innerHTML='❌ Clon / Lotería falsa detectada<br>❌ Patrón: marca + pais + .store/.xyz<br>❌ PINTA ROJO - NO COMPRES';
  t.textContent='FARSA detectada en mismo index.';
 }else{
  h.innerHTML='<div style="color:#ffcc00;font-size:26px;font-weight:900">DESCONOCIDO !</div>';
  c.innerHTML='⚠️ No está en lista blanca<br>⚠️ Buscá en who.is';
  t.textContent='Desconocido.';
 }
}
</script>
</body>
</html>
